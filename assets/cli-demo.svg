<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Terminal Frame -->
  <rect x="20" y="20" width="960" height="520" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" filter="url(#termShadow)" />

  <!-- Title bar -->
  <path d="M20 30 Q20 20 30 20 L970 20 Q980 20 980 30 L980 54 L20 54 Z" fill="#131b2e" />
  <circle cx="44" cy="37" r="6" fill="#ef4444" />
  <circle cx="64" cy="37" r="6" fill="#f59e0b" />
  <circle cx="84" cy="37" r="6" fill="#10b981" />
  <text x="500" y="42" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">terminal — aethertrace demo — 80x24</text>

  <!-- Console Text Output -->
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" xml:space="preserve">
    <!-- Prompt line -->
    <text x="44" y="86" fill="#10b981" font-weight="bold">$ <tspan fill="#f1f5f9">npx aethertrace demo</tspan></text>

    <!-- Banner -->
    <text x="44" y="112" fill="#06b6d4">╔═════════════════════════════════════════════════════════════════╗</text>
    <text x="44" y="128" fill="#06b6d4">║   <tspan fill="#38bdf8" font-weight="bold">AETHERTRACE</tspan> <tspan fill="#64748b">— Autonomous Agent Causal Hypervisor</tspan>             ║</text>
    <text x="44" y="144" fill="#06b6d4">║   <tspan fill="#10b981">Deterministic Replay</tspan> | <tspan fill="#c084fc">Causal Blame</tspan> | <tspan fill="#f59e0b">Active Invariants</tspan>    ║</text>
    <text x="44" y="160" fill="#06b6d4">╚═════════════════════════════════════════════════════════════════╝</text>

    <!-- Stage 1 -->
    <text x="44" y="190" fill="#f1f5f9" font-weight="bold">[1/4] Initializing AetherTrace Autonomous Agent Simulation...</text>
    <text x="64" y="210" fill="#10b981">✔ <tspan fill="#cbd5e1">Step 0: User goal recorded</tspan></text>
    <text x="64" y="228" fill="#10b981">✔ <tspan fill="#cbd5e1">Step 1: Model reasoning captured</tspan></text>
    <text x="64" y="246" fill="#10b981">✔ <tspan fill="#cbd5e1">Step 2: Tool call dispatched (read_logs)</tspan></text>
    <text x="64" y="264" fill="#fbbf24">✔ <tspan fill="#fbbf24">Step 3: Tool observation received (Warning: 500 socket timeout)</tspan></text>
    <text x="64" y="282" fill="#10b981">✔ <tspan fill="#cbd5e1">Step 4: Model formed reasoning path</tspan></text>
    <text x="64" y="302" fill="#c084fc">[AETHERTRACE HYPERVISOR] Evaluating step against active invariants...</text>
    <text x="64" y="322" fill="#f87171" font-weight="bold">⛔ VETOED: Invariant [destructive-command-guard] blocked command "rm -rf /var/auth/cache"!</text>

    <!-- Stage 2 -->
    <text x="44" y="356" fill="#f1f5f9" font-weight="bold">[2/4] Executing Causal Blame Localization Algorithm...</text>
    <text x="64" y="378" fill="#e2e8f0"><tspan fill="#f87171" font-weight="bold">#1 Step 5 [TOOL_CALL]</tspan> execute_shell   Blame: <tspan fill="#f87171" font-weight="bold">80.0%</tspan> | Centrality: 0.3333</text>
    <text x="64" y="396" fill="#94a3b8">   💡 Recommended Remedy: Inspect tool parameters for 'execute_shell'.</text>
    <text x="64" y="416" fill="#e2e8f0"><tspan fill="#fbbf24" font-weight="bold">#2 Step 3 [TOOL_OBSERVATION]</tspan> read_logs   Blame: <tspan fill="#fbbf24" font-weight="bold">62.3%</tspan> | Centrality: 0.3333</text>
    <text x="64" y="434" fill="#94a3b8">   💡 Recommended Remedy: Sanitize return schema before passing to context.</text>

    <!-- Stage 3 & 4 -->
    <text x="44" y="468" fill="#f1f5f9" font-weight="bold">[3/4] Testing Counterfactual Time-Travel Forking...</text>
    <text x="64" y="488" fill="#10b981">✔ <tspan fill="#cbd5e1">Fork created from Step 3 without repeating Steps 0-2 (0 tokens spent)</tspan></text>
    <text x="64" y="506" fill="#10b981">✔ <tspan fill="#cbd5e1">Counterfactual outcome: Failure resolved = </tspan><tspan fill="#10b981" font-weight="bold">true</tspan></text>
  </g>
</svg>
